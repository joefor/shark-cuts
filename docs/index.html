<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shark Cuts</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        margin: 0;
        background: #07111f;
        color: #f3f4f6;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      p {
        margin-top: 0;
        color: #9ca3af;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #111827;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        border-radius: 8px;
        overflow: hidden;
      }
      th,
      td {
        padding: 0.8rem 0.9rem;
        text-align: left;
        border-bottom: 1px solid #374151;
      }
      th {
        background: #0f766e;
        color: white;
      }
      tr.ahead {
        background: #052e2b;
      }
      tr.behind {
        background: #3f1720;
      }
      .pill {
        display: inline-block;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .ahead .pill {
        background: #34d399;
        color: #052e16;
      }
      .behind .pill {
        background: #f87171;
        color: #450a0a;
      }
      .progress-cell {
        width: 24rem;
      }
      .progress {
        position: relative;
        height: 1.75rem;
        border-radius: 999px;
        background: #1f2937;
        overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        font-size: 0.82rem;
        color: #e5e7eb;
      }
      .progress-fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #34d399, #0f766e);
        transition: width 0.3s ease;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .progress .progress-text {
        position: relative;
        z-index: 1;
        white-space: nowrap;
        padding: 0 0.35rem;
      }
      .progress-label {
        display: none;
      }
      .progress-detail {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.35rem;
      }
      .progress-detail .pill {
        margin-left: auto;
      }
      .table-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        align-items: center;
        margin: 0 auto 0.75rem;
        width: fit-content;
      }
      .table-controls label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.95rem;
        color: #d1d5db;
      }
      .table-controls select {
        padding: 0.35rem 0.5rem;
        border-radius: 0.35rem;
        border: 1px solid #374151;
        background: #111827;
        color: #f3f4f6;
      }
      .title-bar {
        background-color: #000000;  /* Makes the bar black */
        width: 100%;                /* Forces bar to stretch full width */
        padding: 20px 0;            /* Adds top and bottom height to the bar */
        display: flex;              /* Activates flexbox alignment layout */
        justify-content: center;    /* Centers the H1 horizontally */
        align-items: center;        /* Centers the H1 vertically */
      }
    </style>
  </head>
  <body>
    <main>
      <div class="title-bar">
        <img src="images/shark_cuts.png" alt="Shark Cuts Logo" height="48"/>
      </div>

      <section>
        <div class="table-controls">
          <label>
            Age Group
            <select id="global-age-select">
              <option value="08U">8 & Under</option>
              <option value="0910">9 & 10</option>
              <option value="1112">11 & 12</option>
              <option value="1314" selected>13 & 14</option>
              <option value="1519">15-19</option>
            </select>
          </label>
          <label>
            Course
            <select id="global-course-select">
              <option value="Y" selected>Short Course Yards</option>
              <option value="L">Long Course Meters</option>
            </select>
          </label>
        </div>
        <h2><img src="images/ymca.png" alt="YMCA" height="24"> NY State Cut Times</h2>
        <table>
          <thead>
            <tr>
              <th>Event</th>
              <th>YMCA Cut</th>
              <th>Abby's Best</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </section>

      <section>
        <h2><img src="images/ni_swimming.png" alt="Niagara Swimming" height="32"> Silver Cut Times</h2>
        <table>
          <thead>
            <tr>
              <th>Event</th>
              <th>Silver Cut</th>
              <th>Abby's Best</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody id="silver-results-body"></tbody>
        </table>
      </section>

      <section>
        <h2><img src="images/ni_swimming.png" alt="Niagara Swimming" height="32"> Gold Cut Times</h2>
        <table>
          <thead>
            <tr>
              <th>Event</th>
              <th>Gold Cut</th>
              <th>Abby's Best</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody id="gold-results-body"></tbody>
        </table>
      </section>
    </main>

    <script src="data/fastest_times.js"></script>
    <script src="data/ymca_state_times.js"></script>
    <script src="data/usa_ni_silver_times.js"></script>
    <script src="data/usa_ni_gold_times.js"></script>
    <script>
      const strokeNames = { 1: "Free", 2: "Back", 3: "Breast", 4: "Fly", 5: "IM" };
      const ageGroupLabels = {
        "08U": "8 & Under",
        "0910": "9 & 10",
        "10U": "10 & Under",
        "1112": "11 & 12",
        "1314": "13 & 14",
        "1519": "15-19",
        "15O": "15 & Over",
      };
      const ageGroupRank = {
        "08U": 0,
        "0910": 1,
        "10U": 1,
        "1112": 3,
        "1314": 4,
        "1519": 5,
        "15O": 6,
      };

      function normalizeAgeGroup(value) {
        if (value === null || value === undefined || value === "") {
          return null;
        }

        const raw = String(value).trim().toUpperCase();
        if (raw === "08U" || raw.startsWith("08")) {
          return "08U";
        }
        if (raw === "0910" || raw === "0912" || raw.startsWith("09")) {
          return "0910";
        }
        if (raw === "10U" || raw.startsWith("10")) {
          return "10U";
        }
        if (raw === "1112" || raw.startsWith("11")) {
          return "1112";
        }
        if (raw === "1314" || raw.startsWith("13")) {
          return "1314";
        }
        if (raw === "1519") {
          return "1519";
        }
        if (raw === "15O" || raw.startsWith("15")) {
          return "15O";
        }
        return null;
      }

      function parseTimeToSeconds(value) {
        if (value === null || value === undefined || value === "") {
          return null;
        }

        const raw = String(value).trim();
        const parts = raw.split(":").map((part) => parseFloat(part));
        if (parts.some((part) => Number.isNaN(part))) {
          return null;
        }

        if (parts.length === 1) {
          return parts[0];
        }
        if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        }
        return parts[0] * 3600 + parts[1] * 60 + parts[2];
      }

      function formatTime(value) {
        if (value === null || value === undefined) {
          return "—";
        }

        const totalSeconds = Math.round(value * 100) / 100;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        const hours = Math.floor(minutes / 60);
        const displayMinutes = minutes % 60;

        if (hours > 0) {
          return `${hours}:${String(displayMinutes).padStart(2, "0")}:${String(seconds.toFixed(2)).padStart(5, "0")}`;
        }
        if (displayMinutes > 0) {
          return `${displayMinutes}:${String(seconds.toFixed(2)).padStart(5, "0")}`;
        }
        return `${seconds.toFixed(2)}`;
      }

      function formatDisplayTime(value) {
        if (value === null || value === undefined || value === "") {
          return "—";
        }

        const raw = String(value).trim();
        if (/^\d+:\d{2}\.\d{2}$/.test(raw)) {
          return raw;
        }

        const parsed = parseTimeToSeconds(value);
        if (parsed === null) {
          return raw;
        }

        const totalSeconds = Math.round(parsed * 100) / 100;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        return `${minutes}:${String(seconds.toFixed(2)).padStart(5, "0")}`;
      }

      function formatDifference(seconds) {
        if (seconds === null) {
          return "—";
        }

        const rounded = seconds.toFixed(2);
        if (seconds <= 0) {
          return `${rounded}s`;
        } else {
          return `+${rounded}s`;
        }
      }

      function getEventLabel(distance, stroke) {
        if (stroke === "5") {
          return `${distance} IM`;
        }
        return `${distance} ${strokeNames[stroke] || stroke}`;
      }

      function buildBestTimesMap(items, course = "Y") {
        const bestByKey = new Map();

        items.forEach((item) => {
          if (!item || item.eventcourse !== course) {
            return;
          }

          const key = `${item.eventgender}|${item.eventdistance}|${item.eventstroke}`;
          const currentTime = parseTimeToSeconds(item.eventtime);
          if (currentTime === null) {
            return;
          }

          const existing = bestByKey.get(key);
          if (!existing) {
            bestByKey.set(key, item);
            return;
          }

          const existingTime = parseTimeToSeconds(existing.eventtime);
          if (currentTime < existingTime) {
            bestByKey.set(key, item);
          }
        });

        return bestByKey;
      }

      function buildComparisonRows(cutTimes, bestTimesMap, ageGroup = "1314", course = "Y") {
        const rows = [];

        cutTimes.forEach((cut) => {
          if (normalizeAgeGroup(cut.eventage) !== ageGroup || cut.eventcourse !== course) {
            return;
          }

          const swimmer = bestTimesMap.get(`${cut.eventgender}|${cut.eventdistance}|${cut.eventstroke}`);
          if (!swimmer) {
            return;
          }

          const cutSeconds = parseTimeToSeconds(cut.eventtime);
          const swimmerSeconds = parseTimeToSeconds(swimmer.eventtime);
          if (cutSeconds === null || swimmerSeconds === null) {
            return;
          }

          rows.push({
            event: getEventLabel(cut.eventdistance, cut.eventstroke),
            ageGroup: ageGroupLabels[cut.eventage] || cut.eventage,
            gender: cut.eventgender === "F" ? "Girls" : "Boys",
            swimmerTime: swimmer.eventtime,
            cutTime: cut.eventtime,
            differenceSeconds: swimmerSeconds - cutSeconds,
            strokeCode: Number(cut.eventstroke),
            distance: Number(cut.eventdistance),
          });
        });

        rows.sort((a, b) => {
          if (a.strokeCode !== b.strokeCode) {
            return a.strokeCode - b.strokeCode;
          }
          if (a.distance !== b.distance) {
            return a.distance - b.distance;
          }
          return a.event.localeCompare(b.event);
        });

        return rows;
      }

      function cubicProgress(cutSeconds, swimmerSeconds) {
        const ratio = cutSeconds / swimmerSeconds;
        const progress = 100 * Math.pow(ratio, 3);
        return Math.min(100, Math.max(0, progress));
      }

      function renderTable(bodyId, cutTimes, ageGroup = "1314", course = "Y") {
        const body = document.getElementById(bodyId);
        if (!body) {
          return;
        }

        const bestTimesForCourse = buildBestTimesMap(fastestTimes, course);
        const rows = buildComparisonRows(cutTimes, bestTimesForCourse, ageGroup, course);
        body.innerHTML = rows
          .map((row) => {
            const rowClass = row.differenceSeconds <= 0 ? "behind" : "ahead";
            const progress = cubicProgress(parseTimeToSeconds(row.cutTime), parseTimeToSeconds(row.swimmerTime));
            return `
            <tr class="${rowClass}">
              <td>${row.event}</td>
              <td>${formatDisplayTime(row.cutTime)}</td>
              <td>${formatDisplayTime(row.swimmerTime)}<br/>(${formatDifference(row.differenceSeconds)})</td>
              <td class="progress-cell">
                <div class="progress" aria-label="Progress to cut: ${progress.toFixed(1)}%">
                  <div class="progress-fill" style="width: ${progress.toFixed(1)}%;">
                    <span class="progress-text">${progress.toFixed(1)}%</span>
                  </div>
                </div>
              </td>
            </tr>
          `;
          })
          .join("");
      }

      function initializeTable(bodyId, cutTimes) {
        const ageSelect = document.getElementById("global-age-select");
        const courseSelect = document.getElementById("global-course-select");

        if (!ageSelect || !courseSelect) {
          return;
        }

        const render = () => {
          renderTable(bodyId, cutTimes, ageSelect.value, courseSelect.value);
        };

        ageSelect.addEventListener("change", render);
        courseSelect.addEventListener("change", render);
        render();
      }

      initializeTable("results-body", ymcaStateTimes);
      initializeTable("silver-results-body", usaNiSilverTimes);
      initializeTable("gold-results-body", usaNiGoldTimes);

    </script>
  </body>
</html>
